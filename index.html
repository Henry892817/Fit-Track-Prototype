<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitTrack Watch Prototype</title><style>body{background:#e9eef5;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}.watch{width:290px;height:390px;background:#071622;border:15px solid #111827;border-radius:70px;padding:25px;color:white;box-shadow:0 15px 40px #9aa}header{display:flex;justify-content:space-between;color:#9ce8d3;font-size:14px;margin:12px 0 35px}h2{font-size:24px}section{display:none}section.active{display:block}.metric{background:#172b39;border-radius:17px;margin:12px 0;padding:15px;font-size:21px}.metric small{display:block;font-size:11px;color:#b8cad8;margin-top:5px}.green{color:#59dfad}.pink{color:#fa8398}.gold{color:#ffc66e}button{cursor:pointer;border:0;border-radius:25px;padding:14px;background:#59dfad;color:#082923;font-weight:bold;font-size:16px}button:focus-visible{outline:3px solid white}.secondary{background:#203947;color:white}.nav{margin-top:20px;display:flex;gap:8px;justify-content:center}.nav button{font-size:12px;padding:10px}.center{text-align:center}.start{height:160px;width:160px;border-radius:100%;margin:18px auto;display:block}.note{margin-top:70px}.note p{line-height:1.5}</style><div class="watch"><header><b>FITTRACK</b><span>09:41</span></header><section id="home" class="active"><h2>Today's activity</h2><div class="metric"><span class="green">●</span> 7,420<small>STEPS</small></div><div class="metric"><span class="pink">♥</span> 78 bpm<small>HEART RATE</small></div><div class="metric"><span class="gold">◆</span> 325 kcal<small>CALORIES</small></div></section><section id="notification" class="center note"><p class="green">ACTIVITY REMINDER</p><h2>Time to move!</h2><p>A short walk keeps<br>you on track.</p><button onclick="show('home')">OK</button></section><section id="training" class="center"><h2>Ready to train?</h2><p>Track your workout</p><button class="start" id="start" onclick="toggleTraining()">START<br>TRAINING</button><button class="secondary" onclick="show('history')">Results history</button></section><section id="history" class="center"><h2>Results history</h2><p>No completed workouts yet.</p><button onclick="show('training')">Back</button></section><div class="nav"><button class="secondary" onclick="show('home')">Home</button><button class="secondary" onclick="show('notification')">Reminder</button><button class="secondary" onclick="show('training')">Training</button></div></div><script>let active=false;function show(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===id))}function toggleTraining(){active=!active;document.getElementById('start').innerHTML=active?'STOP<br>TRAINING':'START<br>TRAINING'}</script></html>
